<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zane Shop</title>
    <style>

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f4f6f9;
        color: #333;
    }
    header {
        background: linear-gradient(135deg, #111111, #2c3e50);
        color: #fff;
        text-align: center;
        padding: 2.5rem 1rem;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    header h1 {
        margin: 0;
        font-size: 2.3rem;
        letter-spacing: 2px;
        font-weight: 700;
        text-transform: uppercase;
    }
    header p {
        margin: 0.5rem 0 0 0;
        opacity: 0.8;
        font-size: 0.95rem;
    }
    .container {
        max-width: 1200px;
        margin: 2rem auto;
        padding: 0 1rem;
    }
    .section-title {
        font-size: 1.3rem;
        margin: 2.5rem 0 1.2rem 0;
        padding-left: 0.6rem;
        border-left: 5px solid #3b82f6;
        color: #1e293b;
    }
    .product-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 1.5rem;
        margin-bottom: 3rem;
    }
    .product-card {
        background: #fff;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.04);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        display: flex;
        flex-direction: column;
        padding: 0 0 1.5rem 0;
        border: 1px solid rgba(0,0,0,0.03);
    }
    .product-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
    }
    .product-img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        transition: transform 0.5s ease;
    }
    .product-card:hover .product-img {
        transform: scale(1.03);
    }
    .product-icon {
        font-size: 4rem;
        text-align: center;
        padding: 2.5rem 0;
        background: #f8fafc;
    }
    .product-name {
        font-weight: 600;
        font-size: 1.1rem;
        margin: 1.2rem 1rem 0.5rem 1rem;
        color: #1e293b;
    }
    .product-price {
        color: #10b981;
        font-weight: 700;
        font-size: 1.1rem;
        margin: 0 1rem 1.2rem 1rem;
    }
    .buy-btn {
        display: block;
        background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        color: white;
        text-align: center;
        padding: 0.75rem;
        margin: 0 1rem;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 600;
        transition: all 0.3s ease;
        box-shadow: 0 4px 10px rgba(59, 130, 246, 0.25);
    }
    .buy-btn:hover {
        background: linear-gradient(135deg, #1d4ed8, #1e40af);
        box-shadow: 0 6px 15px rgba(59, 130, 246, 0.35);
    }
            .search-container {
        margin: 1.5rem 0;
        display: flex;
        justify-content: center;
    }
    #search-input {
        width: 100%;
        max-width: 500px;
        padding: 0.8rem 1.2rem;
        font-size: 1rem;
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        outline: none;
        transition: all 0.3s ease;
        box-shadow: 0 4px 6px rgba(0,0,0,0.02);
    }
    #search-input:focus {
        border-color: #3b82f6;
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
    }
.product-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
    }
    .product-card {
        display: block;
        border: 1px solid #ddd;
        padding: 10px;
        width: 200px;
    }
        
</style>
    <header>
        <h1>ZANE SHOP</h1>
        <p>အဝတ်အစားနှင့် ဖုန်းဆက်စပ်ပစ္စည်းများ အရောင်းဆိုင်</p>
    </header>

    <div class="container">
    <div class="search-container">
        <input type="text" id="search-input" placeholder="🔍 ပစ္စည်းရှာဖွေရန်...">
    </div>
        <div class="filter-buttons" style="margin-bottom: 20px; text-align: center;">
    <button onclick="filterProduct('all')">အားလုံး</button>
    <button onclick="filterProduct('clothing')">Clothing</button>
    <button onclick="filterProduct('phone')">Phone Accessories</button>
        </div>
        
        <!-- Clothing Section -->
<h2 class="section-title">👕 Clothing (အဝတ်အစား)</h2>
<div class="product-grid">
    <div class="product-card" data-category="clothing">
        <img src="shirt.png" class="product-img" alt="Standard T-Shirt">
        <div class="product-name">Standard T-Shirt</div>
        <div class="product-price">900,000 MMK</div>
        <button class="buy-btn" onclick="openModal('Standard T-Shirt', '900,000 MMK')">ဝယ်ယူရန်</button>
    </div>
    <div class="product-card" data-category="clothing">
        <img src="cigarette.png" class="product-img" alt="Premium Cigarette">
        <div class="product-name">Premium T-shirt</div>
        <div class="product-price">30,000 MMK</div>
        <button class="buy-btn" onclick="openModal('Premium T-shirt', '30,000 MMK')">ဝယ်ယူရန်</button>
    </div>
    <div class="product-card" data-category="clothing">
        <img src="streetwearjacket.jpg" class="product-img" alt="Streetwear Jacket">
        <div class="product-name">Streetwear Jacket</div>
        <div class="product-price">35,000 MMK</div>
        <button class="buy-btn" onclick="openModal('Streetwear Jacket', '35,000 MMK')">ဝယ်ယူရန်</button>
    </div>
</div>

<!-- Phone Accessories Section -->
<h2 class="section-title">📱 Phone Accessories (ဖုန်းပစ္စည်း)</h2>
<div class="product-grid">
    <div class="product-card" data-category="phone">
        <div class="product-icon">🔌</div>
        <div class="product-name">Fast Charger 20W</div>
        <div class="product-price">18,000 MMK</div>
        <button class="buy-btn" onclick="openModal('Fast Charger 20W', '18,000 MMK')">ဝယ်ယူရန်</button>
    </div>
    <div class="product-card" data-category=phone">
        <div class="product-icon">🎧</div>
        <div class="product-name">Wireless Earbuds</div>
        <div class="product-price">28,000 MMK</div>
        <button class="buy-btn" onclick="openModal('Wireless Earbuds', '28,000 MMK')">ဝယ်ယူရန်</button>
    </div>
</div>
</div>

<script>
    // ၁။ ပစ္စည်းရှာဖွေသည့်စနစ် (Search Bar)
    document.getElementById('search-input').addEventListener('input', function(e) {
        const searchText = e.target.value.toLowerCase();
        const products = document.querySelectorAll('.product-card');
        products.forEach(product => {
            const name = product.querySelector('.product-name').textContent.toLowerCase();
            product.style.display = name.includes(searchText) ? '' : 'none';
        });
    });
    function filterProduct(category) {
    const products = document.querySelectorAll('.product-card');
    products.forEach(product => {
        if (category === 'all' || product.getAttribute('data-category') === category) {
            product.style.display = 'block';
        } else {
            product.style.display = 'none';
        }
    });
}

    // ၂။ Pop-up စနစ်
    let currentProduct = "", currentPrice = "";
    function openModal(name, price) {
        currentProduct = name;
        currentPrice = price;
        document.getElementById('order-modal').style.display = 'block';
    }

            function sendOrder() {
        const name = document.getElementById('cust-name').value;
        const address = document.getElementById('cust-address').value;
        const qty = document.getElementById('cust-qty').value;
        const msg = `Hi Zane Shop, ${currentProduct} (${currentPrice}) ကို ${qty} ခု မှာယူချင်ပါတယ်။\nနာမည်: ${name}\nလိပ်စာ: ${address}`;
        window.open(`https://t.me/loki6383?text=${encodeURIComponent(msg)}`);
        document.getElementById('order-modal').style.display = 'none';
    }
</script>

<!-- Pop-up ဖောင် -->
<div id="order-modal" style="display:none; position:fixed; top:20%; left:10%; width:80%; background:#fff; padding:20px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.5); z-index:999;">
    <h3>မှာယူမည်</h3>
    <input type="text" id="cust-name" placeholder="နာမည်" style="width:100%; margin-bottom:10px; padding:8px;">
    <input type="number" id="cust-qty" value="1" min="1" style="width:100%; margin-bottom:10px;">
    <input type="text" id="cust-address" placeholder="လိပ်စာ" style="width:100%; margin-bottom:10px; padding:8px;">
    <button onclick="sendOrder()" style="padding:10px; background:blue; color:white; border:none;">Confirm မှာယူမည်</button>
    <button onclick="document.getElementById('order-modal').style.display='none'" style="padding:10px;">ပိတ်မည်</button>
</div>
</body>
</html>
